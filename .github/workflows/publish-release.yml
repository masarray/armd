name: Publish ARMD release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix. Leave empty to use package.json."
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-tag:
    name: Create release tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if [[ -z "$version" ]]; then
            version="$(node -p "require('./package.json').version")"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists. Bump package.json or enter a new version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create and push signed-by-GitHub release tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "ARMD $TAG"
          git push origin "$TAG"

      - name: Release pipeline notice
        run: |
          echo "Tag ${{ steps.version.outputs.tag }} was pushed."
          echo "The Cross-platform release workflow will now build Windows Inno Setup, Linux AppImage, and Linux DEB artifacts and publish the GitHub Release."

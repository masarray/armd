name: Trigger ARMD release

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-trigger.txt"

permissions:
  contents: write

jobs:
  tag-current-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create current version tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; no new tag is required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "ARMD $tag"
          git push origin "$tag"
          echo "Created ${tag}; the cross-platform release workflow will publish the binaries."
